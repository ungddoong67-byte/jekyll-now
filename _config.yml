#
# !! Build & Jekyll settings !!
#

permalink: /:title/

# Jekyll Now 버전
version: v1.2.0

# 마크다운 및 파서 설정
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Sass 설정
sass:
  style: :expanded

# 플러그인 설정 (Jekyll 최신 규격 plugins 사용)
plugins:
  - jekyll-sitemap
  - jekyll-feed

# 빌드 시 제외할 파일 목록
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
